<header class="site-header">
  <nav class="nav-pill" aria-label="Main navigation">
    <a
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
    >Work</a>
    <a routerLink="/info" routerLinkActive="active" ariaCurrentWhenActive="page">Info</a>
  </nav>

  <a
    class="contact-button"
    href="https://drive.google.com/file/d/102kSUwy3YArZ8SbswwF2DXx9R7GSqeS9/view?usp=drivesdk"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Open Google Drive file"
  >@</a>
</header>

<router-outlet></router-outlet>

<footer class="site-footer">
  <div class="footer-main">
    <div>
      <span class="footer-label">MAIN</span>
      <a routerLink="/">Work</a>
      <a routerLink="/info">Info</a>
    </div>
    <div>
      <span class="footer-label">CONTACT</span>
      <a [href]="'tel:' + portfolio.phone">Điện thoại: {{ portfolio.phone }}</a>
      <a [href]="portfolio.facebook" target="_blank" rel="noreferrer">Facebook ↗</a>
      <a [href]="'mailto:' + portfolio.contactEmail">Gmail: {{ portfolio.contactEmail }}</a>
    </div>
  </div>

  <div class="footer-meta">
    <div>
      <p>{{ portfolio.footer.copyright }}</p>
      <p class="muted">{{ portfolio.footer.note }}</p>
    </div>
    <p class="muted footer-soon">{{ portfolio.footer.comingSoon }}</p>
  </div>
</footer>
